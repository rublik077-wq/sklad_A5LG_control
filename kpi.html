<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KPI Склада</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #fff; color: #000; padding: 15px; margin: 0; }
        h2, h3 { color: #2481cc; margin-top: 10px; }
        .admin-panel { background: #f4f4f5; padding: 15px; border-radius: 10px; margin-bottom: 25px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; background: #fff; color: #000; font-size: 16px; }
        button { width: 100%; padding: 12px; background: #2481cc; color: #fff; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; background: #fff; }
        th, td { border: 1px solid #ddd; padding: 12px 10px; text-align: left; font-size: 15px; }
        th { background-color: #eee; font-weight: bold; }
        tr:nth-child(even) { background-color: rgba(0, 0, 0, 0.02); }
        .loading { text-align: center; padding: 20px; font-style: italic; color: #888; }
    </style>
</head>
<body>

    <h2>📊 Учет ошибок склада</h2>

    <!-- Форма ввода принудительно открыта у ВСЕХ для проверки связи -->
    <div id="adminForm" class="admin-panel" style="display: block;">
        <h3>Добавить новую ошибку</h3>
        <div class="form-group">
            <label>Дата ошибки</label>
            <input type="date" id="date">
        </div>
        <div class="form-group">
            <label>Клиент (Контрагент)</label>
            <input type="text" id="client" placeholder="Название компании">
        </div>
        <div class="form-group">
            <label>Вид ошибки</label>
            <select id="errorType">
                <option value="отбор">отбор</option>
                <option value="приемка">приемка</option>
                <option value="пополнение">пополнение</option>
                <option value="размещение">размещение</option>
            </select>
        </div>
        <div class="form-group">
            <label>Сотрудник (Фамилия)</label>
            <input type="text" id="worker" placeholder="Иванов">
        </div>
        <button onclick="sendData()">Сохранить в таблицу</button>
    </div>

    <h3>Сводная статистика KPI</h3>
    <table id="reportTable">
        <thead>
            <tr>
                <th>Сотрудник</th>
                <th>Допущенные ошибки</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <tr><td colspan="2" class="loading">Загрузка данных из таблицы...</td></tr>
        </tbody>
    </table>

    <script>
        // Ссылка из строки 78
       const GOOGLE_API_URL = 'https://script.google.com/macros/s/AKfycby3Vz48yDy8KoDmcuqCh_Z6qQsV-FbaF9I_iP0zCXbjNLWsTTJO_rzTnB4epvxdlYNK/exec';
        document.getElementById('date').value = new Date().toISOString().split('T')[0];
const GOOGLE_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQJ3RBC0TXSz-h7RPeMaHKOemqYEZoxz1RV8iNnDtHGJQIdUZ9mhzmIwakGkAqj-XcVZpytMz-9FeHe/pub?gid=1159113882&single=true&output=csv';
        
        // Приемник данных (JSONP)
        window.handleData = function(data) {
            let html = '';
            if (!data || data.length === 0) {
                html = '<tr><td colspan="2" class="loading">Ошибок пока нет. Все работают отлично!</td></tr>';
            } else {
                const filteredData = data.filter(row => row.name !== 'Работник' && row.name.trim() !== '');
                if (filteredData.length === 0) {
                    html = '<tr><td colspan="2" class="loading">Ошибок пока нет. Все работают отлично!</td></tr>';
                } else {
                    filteredData.forEach(row => {
                        html += `<tr><td><b>${row.name}</b></td><td>${row.errors}</td></tr>`;
                    });
                }
            }
            document.getElementById('tableBody').innerHTML = html;
        };

        // Безопасный запрос сводки без ограничений CORS
        function loadReport() {
            const oldScript = document.getElementById('jsonp-script');
            if (oldScript) oldScript.remove();

            const script = document.createElement('script');
            script.id = 'jsonp-script';
            script.src = GOOGLE_API_URL + '?callback=handleData&_ts=' + new Date().getTime();
            document.body.appendChild(script);
        }

        // Отправка формы в таблицу
        function sendData() {
            const dateVal = document.getElementById('date').value;
            const clientVal = document.getElementById('client').value.trim();
            const errorVal = document.getElementById('errorType').value;
            const workerVal = document.getElementById('worker').value.trim();

            if (!clientVal || !workerVal) {
                alert('Пожалуйста, заполните поля "Клиент" и "Сотрудник"');
                return;
            }

            const payload = {
                date: dateVal,
                client: clientVal,
                error: errorVal,
                worker: workerVal
            };

            fetch(GOOGLE_API_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(() => {
                document.getElementById('client').value = '';
                document.getElementById('worker').value = '';
                alert('Данные успешно сохранены в таблицу!');
                setTimeout(loadReport, 1500); // Обновляем сводку на экране
            })
            .catch(err => alert('Ошибка при сохранении: ' + err));
        }

        // Запуск загрузки
        loadReport();
    </script>
</body>
</html>
