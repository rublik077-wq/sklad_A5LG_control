<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KPI Склада</title>
    <!-- ИСПРАВЛЕНО: Подключаем правильный полный путь к скрипту Telegram Web Apps API -->
    <script src="https://telegram.org"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--tg-theme-bg-color, #fff); color: var(--tg-theme-text-color, #000); padding: 15px; margin: 0; }
        h2, h3 { color: var(--tg-theme-button-color, #2481cc); margin-top: 10px; }
        .admin-panel { display: none; background: var(--tg-theme-secondary-bg-color, #f4f4f5); padding: 15px; border-radius: 10px; margin-bottom: 25px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; background: var(--tg-theme-bg-color, #fff); color: var(--tg-theme-text-color, #000); font-size: 16px; }
        button { width: 100%; padding: 12px; background: var(--tg-theme-button-color, #2481cc); color: var(--tg-theme-button-text-color, #fff); border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
        button:active { opacity: 0.8; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; background: var(--tg-theme-bg-color, #fff); }
        th, td { border: 1px solid var(--tg-theme-secondary-bg-color, #ddd); padding: 12px 10px; text-align: left; font-size: 15px; }
        th { background-color: var(--tg-theme-secondary-bg-color, #eee); font-weight: bold; }
        tr:nth-child(even) { background-color: rgba(0, 0, 0, 0.02); }
        .loading { text-align: center; padding: 20px; font-style: italic; color: #888; }
    </style>
</head>
<body>

    <h2>📊 Учет ошибок склада</h2>

    <!-- Форма ввода для Администратора -->
    <div id="adminForm" class="admin-panel">
        <h3>Добавить новую ошибку</h3>
        <div class="form-group">
            <label>Дата ошибки</label>
            <input type="date" id="date">
        </div>
        <div class="form-group">
            <label>Клиент (Контрагент)</label>
            <input type="text" id="client" placeholder="Название компании">
        </div>
        <div class="form-group">
            <label>Вид ошибки</label>
            <select id="errorType">
                <option value="отбор">отбор</option>
                <option value="приемка">приемка</option>
                <option value="пополнение">пополнение</option>
                <option value="размещение">размещение</option>
            </select>
        </div>
        <div class="form-group">
            <label>Сотрудник (Фамилия)</label>
            <input type="text" id="worker" placeholder="Иванов">
        </div>
        <button onclick="sendData()">Сохранить в таблицу</button>
    </div>

    <!-- Таблица со статистикой для всех -->
    <h3>Сводная статистика KPI</h3>
    <table id="reportTable">
        <thead>
            <tr>
                <th>Сотрудник</th>
                <th>Допущенные ошибки</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <tr><td colspan="2" class="loading">Загрузка данных из таблицы...</td></tr>
        </tbody>
    </table>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); 

        const MY_TELEGRAM_ID = 868803059;
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby3Vz48yDy8KoDmcuqCh_Z6qQsV-FbaF9I_iP0zCXbjNLWsTTJO_rzTnB4epvxdlYNK/exec';

        // Автоматически подставляем сегодняшнюю дату в форму
        document.getElementById('date').value = new Date().toISOString().split('T')[0];

        // Проверяем права доступа: если зашел создатель, показываем админку
        if (tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id === MY_TELEGRAM_ID) {
            document.getElementById('adminForm').style.display = 'block';
        }

        function sendData() {
            const dateVal = document.getElementById('date').value;
            const clientVal = document.getElementById('client').value.trim();
            const errorVal = document.getElementById('errorType').value;
            const workerVal = document.getElementById('worker').value.trim();

            if (!clientVal || !workerVal) {
                tg.showAlert('Пожалуйста, заполните поля "Клиент" и "Сотрудник"');
                return;
            }

            tg.MainButton.setText('Сохранение...').show();

            const payload = {
                date: dateVal,
                client: clientVal,
                error: errorVal,
                worker: workerVal
            };

            fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors', 
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(() => {
                tg.MainButton.hide();
                document.getElementById('client').value = '';
                document.getElementById('worker').value = '';
                loadReport();
                tg.showPopup({ message: 'Ошибка успешно записана!' });
            })
            .catch(err => {
                tg.MainButton.hide();
                tg.showAlert('Ошибка отправки: ' + err);
            });
        }

        function loadReport() {
            fetch(GOOGLE_SCRIPT_URL)
            .then(res => res.json())
            .then(data => {
                let html = '';
                const filteredData = data.filter(row => row.name !== 'Работник' && row.name !== '');
                
                if (filteredData.length === 0) {
                    // ИСПРАВЛЕНО: Добавлена пропущенная открывающая угловая скобка < перед tr
                    html = '<tr><td colspan="2" class="loading">Ошибок пока нет. Все работают отлично!</td></tr>';
                } else {
                    filteredData.forEach(row => {
                        html += `<tr><td><b>${row.name}</b></td><td>${row.errors}</td></tr>`;
                    });
                }
                document.getElementById('tableBody').innerHTML = html;
            })
            .catch(err => {
                document.getElementById('tableBody').innerHTML = `<tr><td colspan="2" class="loading" style="color:red;">Ошибка загрузки данных: ${err}</td></tr>`;
            });
        }

        loadReport();
    </script>
</body>
</html>
